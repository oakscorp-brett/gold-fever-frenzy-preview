let AC=null,muted=false;

const Music=(function(){let bus=null,noise=null,cur=null,want='map',timer=null,next=0,step=0,trackGain={};
 const N=n=>440*Math.pow(2,(n-69)/12);

// Prospector voice speed. 0.88 = about 12% slower. Web Audio playbackRate would also lower the pitch, so clips are time-stretched once on decode (WSOLA), which keeps the voice's pitch.
const VOICE_RATE=0.88;
function vStretchCh(chs,sr,rate){const N=Math.round(sr*.03)&~1,Hs=N>>1,Ha=Hs*rate,tol=Math.round(sr*.008),inL=chs[0].length,outL=Math.ceil(inL/rate)+N;
 const win=new Float32Array(N);for(let i=0;i<N;i++)win[i]=.5-.5*Math.cos(2*Math.PI*i/N);
 const mono=chs.length>1?chs[0].map((v,i)=>(v+chs[1][i])/2):chs[0];const out=chs.map(()=>new Float32Array(outL)),norm=new Float32Array(outL);
 let prev=0;const at=(a,i)=>i>=0&&i<inL?a[i]:0;
 for(let k=0;;k++){const nom=Math.round(k*Ha),op=k*Hs;if(nom>=inL||op+N>outL)break;let best=nom;
  if(k>0){const nat=prev+Hs;let bc=-Infinity;for(let d=-tol;d<=tol;d+=2){const p=nom+d;let c=0;for(let i=0;i<N;i+=4)c+=at(mono,nat+i)*at(mono,p+i);if(c>bc){bc=c;best=p}}}
  for(let ch=0;ch<chs.length;ch++){const a=chs[ch],o=out[ch];for(let i=0;i<N;i++)o[op+i]+=at(a,best+i)*win[i]}
  for(let i=0;i<N;i++)norm[op+i]+=win[i];prev=best}
 const L=Math.ceil(inL/rate);for(const o of out)for(let i=0;i<L;i++)if(norm[i]>1e-3)o[i]/=norm[i];return out.map(o=>o.subarray(0,L))}
function vSlow(buf){if(VOICE_RATE===1)return buf;try{const chs=[];for(let c=0;c<buf.numberOfChannels;c++)chs.push(buf.getChannelData(c));const o=vStretchCh(chs,buf.sampleRate,VOICE_RATE),nb=AC.createBuffer(o.length,o[0].length,buf.sampleRate);o.forEach((d,c)=>nb.getChannelData(c).set(d));return nb}catch(e){return buf}}
function vload(k){if(vbuf[k]||!AC)return vbuf[k];const b=atob(VOICE_DATA[k]),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);vbuf[k]=AC.decodeAudioData(u.buffer).then(vSlow).catch(e=>{vbuf[k]=null;throw e});return vbuf[k]}
function speakFallback(t){if(!('speechSynthesis' in window))return;try{const u=new SpeechSynthesisUtterance(t);u.rate=.95*VOICE_RATE;u.pitch=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function voice(k,force){if(S.voice===false||window.SIM||!VOICE_DATA[k])return;const n=Date.now();if(!force&&n-lastSay<1800)return;lastSay=n;
 try{audioInit();if(!AC)throw 0;if(AC.state==='suspended')AC.resume();vload(k).then(buf=>{if(S.voice===false)return;try{if(vsrc)vsrc.stop()}catch(e){}const s=AC.createBufferSource(),g=AC.createGain();g.gain.value=1.1;s.buffer=buf;s.connect(g);g.connect(AC.destination);s.start();vsrc=s}).catch(()=>speakFallback(TEXT[k]))}catch(e){speakFallback(TEXT[k])}}

<script>
// ===== Prospector Trail: a monthly reward track. Free rewards for everyone; optional Gold Trail ($4.99, this month only, never renews) doubles up =====
(function(){
const TIERS=25,XP=60;
const freeR=t=>t===TIERS?{oz:150,dyn:2,det:2,plus:2}:t%5===0?{oz:20+t*2,dyn:1,plus:t%10===0?1:0}:{oz:8+t};
const paidR=t=>t===TIERS?{oz:400,dyn:3,det:3,plus:3}:t%5===0?{oz:40+t*4,dyn:1,det:1,plus:1}:t%2?{oz:16+t*2}:{oz:12+t,[(t/2)%2?'dyn':'det']:1};
const MN=['January','February','March','April','May','June','July','August','September','October','November','December'];
function TR(){const k=GE.monthKey();let t=S.trail;
 if(!t||t.month!==k){ // new month: hand out anything earned but not collected last month, then start fresh
  if(t&&t.month){let got={oz:0,dyn:0,det:0,plus:0},n=0;const lvl=Math.min(TIERS,Math.floor(t.xp/XP));for(let i=1;i<=lvl;i++){const add=r=>{for(const q in r)got[q]+=r[q]||0;n++};if(!t.f[i])add(freeR(i));if(t.paid===t.month&&!t.p[i])add(paidR(i))}if(n){GE.give(got);setTimeout(()=>toast(`🧭 Last month's Trail rewards were added for you: ${GE.rewardText(got)}`,4200),2600)}}
  t=S.trail={month:k,xp:0,f:{},p:{},paid:''};save()}return t}
const level=()=>Math.min(TIERS,Math.floor(TR().xp/XP));
const paid=()=>TR().paid===TR().month;
const claimable=()=>{const t=TR(),l=level();let n=0;for(let i=1;i<=l;i++){if(!t.f[i])n++;if(paid()&&!t.p[i])n++}return n};
function xp(n){const t=TR();const before=level();t.xp+=n;save();const after=level();if(after>before)setTimeout(()=>toast(`🧭 Prospector Trail: tier ${after} reached! Collect it on the map.`,2600),3300);GE.renderChips()}
GE.on('win',w=>xp(w.bonus?20:w.stars*10));GE.on('task',()=>xp(15));
window.TRAIL_GRANT=()=>{const t=TR();t.paid=t.month;save();setTimeout(()=>{SFX.win();if(!calm())coinShower(70);toast(`🧭 Gold Trail unlocked for ${MN[new Date().getMonth()]}!`,3200);GE.renderChips();if($('ov').classList.contains('on')&&$('trList'))openTrail()},200)};
const css=document.createElement('style');css.textContent=`
#trList{display:flex;flex-direction:column;gap:5px;margin:8px 0;text-align:left}
.trr{display:grid;grid-template-columns:34px 1fr 1fr;gap:5px;align-items:stretch}

.trr .c{background:#0005;border:2px solid #5a3a1c;border-radius:10px;padding:5px 6px;font-size:12px;line-height:1.25;display:flex;flex-direction:column;justify-content:center;gap:3px}
.trr .c.gold{border-color:#c8962e;background:linear-gradient(#5a4012,#2a1a0e)}.trr .c.lk{opacity:.5}.trr .c.ok{border-color:#7fd15a}.trr .c.done{opacity:.45}
.trr .c .btn{padding:4px 6px;font-size:12px}.trr.cur .n{background:#4e9a2e;color:#fff}
.trh{display:grid;grid-template-columns:34px 1fr 1fr;gap:5px;font-size:12px;font-weight:800;text-align:center}`;document.head.appendChild(css);
function openTrail(){const t=TR(),l=level(),pd=paid(),has=window.IAP&&IAP.has('goldtrail');const d=new Date(),end=new Date(d.getFullYear(),d.getMonth()+1,1),days=Math.max(1,Math.ceil((end-d)/864e5));
 let h=`<h2>🧭 Prospector Trail</h2><p style="font-size:13px;margin:2px 0">${MN[d.getMonth()]} trail · ${days} day${days>1?'s':''} left · Tier <b>${l}</b>/${TIERS}</p>
 <div class="tk"><div class="tx">🧭 ${t.xp%XP}/${XP} to next tier<div class="bar"><div style="width:${l>=TIERS?100:Math.round((t.xp%XP)/XP*100)}%"></div></div><span style="font-size:11px;opacity:.8">Earn trail points: ⭐ 10 per star · 📋 15 per daily task · ⏱ 20 per Gold Rush</span></div></div>`;
 if(!pd)h+=has?`<div class="tk gold" style="border-color:#c8962e"><div class="ic">🧭</div><div class="tx"><b>Gold Trail</b><br>Unlock the gold column for ${MN[d.getMonth()]}: more gold and boosters on every tier. This month only, does not renew.</div><button class="btn g s" id="trBuy">${IAP.priceOf('goldtrail')}</button></div><p style="font-size:11px;opacity:.75;margin:0">Real money. Ask a grown-up first.</p>`:`<p style="font-size:12px;opacity:.75">Gold Trail rewards are coming in a future update.</p>`;
 if(claimable())h+=`<button class="btn g" id="trAll" style="margin:6px 0">Collect all (${claimable()})</button>`;
 h+=`<div class="trh"><span></span><span>Free</span><span>🧭 Gold Trail${pd?' ✔':''}</span></div><div id="trList">`;
 for(let i=1;i<=TIERS;i++){const rch=i<=l;const fc=t.f[i]?'done':rch?'ok':'lk',pc=t.p[i]?'done':(rch&&pd)?'ok':'lk';
  h+=`<div class="trr ${i===l+1?'cur':''}"><div class="n">${i}</div><div class="c ${fc}">${GE.rewardText(freeR(i))}${t.f[i]?' ✔':rch?`<button class="btn g" data-tf="${i}">Collect</button>`:''}</div><div class="c gold ${pc}">${pd?'':'🔒 '}${GE.rewardText(paidR(i))}${t.p[i]?' ✔':(rch&&pd)?`<button class="btn g" data-tp="${i}">Collect</button>`:''}</div></div>`}
 h+=`</div><div class="stick"><button class="btn" id="trX">Close</button></div>`;
 showOv(h,()=>{onTap($('trX'),()=>{hideOv();showMap()});
  const cl=(i,paidCol)=>{const t=TR();const m=paidCol?t.p:t.f;if(m[i])return;m[i]=1;GE.give(paidCol?paidR(i):freeR(i))};
  document.querySelectorAll('[data-tf]').forEach(b=>onTap(b,()=>{cl(+b.dataset.tf,false);SFX.coin(3);openTrail()}));
  document.querySelectorAll('[data-tp]').forEach(b=>onTap(b,()=>{cl(+b.dataset.tp,true);SFX.coin(4);openTrail()}));
  const a=$('trAll');if(a)onTap(a,()=>{for(let i=1;i<=level();i++){cl(i,false);if(paid())cl(i,true)}SFX.win();toast('🧭 Trail rewards collected!');openTrail()});
  const by=$('trBuy');if(by)onTap(by,()=>IAP.buyOrStub('goldtrail',ok=>{if(ok)setTimeout(openTrail,250)}));
  const cur=document.querySelector('.trr.cur');if(cur&&l>2)setTimeout(()=>cur.scrollIntoView({block:'center'}),50)})}
window.openTrail=openTrail;
GE.chip({id:'trail',order:35,html:()=>{const n=claimable();return `🧭 Trail ${level()}/${TIERS}${n?`<span class="dot">${n}</span>`:''}`},hot:()=>claimable()>0,tap:openTrail});
